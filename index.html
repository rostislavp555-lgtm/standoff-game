<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Спонсоры Розыгрыша в Standoff 2</title>
    <style>
        body {
            background-color: #1a1a24;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .game-card {
            background: #252634;
            border: 2px solid #ff9e00;
            border-radius: 16px;
            padding: 30px;
            width: 350px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 20px;
            color: #ff9e00;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .stats {
            background: #1a1a24;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .gold {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
        }

        .btn-action {
            background: linear-gradient(45deg, #ff9e00, #ff6000);
            border: none;
            color: white;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s;
            margin-bottom: 10px;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .btn-buy {
            background: #3a3b4d;
            border: 1px solid #ff9e00;
            color: white;
            padding: 10px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }

        .log {
            margin-top: 15px;
            font-size: 12px;
            color: #aaaaaa;
            height: 40px;
        }
    </style>
</head>
<body>

<div class="game-card">
    <h1>🎯 Спонсоры Розыгрыша<br><span style="color:white; font-size: 14px;">Standoff 2</span></h1>

    <div class="stats">
        <div>Баланс: <span class="gold" id="gold-count">0</span> 🪙 Голды</div>
        <div style="margin-top: 8px; font-size: 14px;">Подписок на спонсоров: <span id="subs-count">0</span></div>
    </div>

    <button class="btn-action" onclick="subscribeSponsor()">ПОДПИСАТЬСЯ НА СПОНСОРА</button>
    <button class="btn-buy" onclick="buyAutoclicker()">Купить Авто-Бот (+1 голда/сек) — 50 Голды</button>

    <div class="log" id="log-text">Подписывайся на спонсоров, чтобы копить голду!</div>
</div>

<script>
    let gold = 0;
    let subs = 0;
    let autoClickers = 0;

    const goldElem = document.getElementById('gold-count');
    const subsElem = document.getElementById('subs-count');
    const logElem = document.getElementById('log-text');

    // Клик по кнопке подписки
    function subscribeSponsor() {
        gold += 5;
        subs += 1;
        goldElem.textContent = gold;
        subsElem.textContent = subs;

        const sponsors = ["Клан BOSTN", "CyberTrade", "GoldMarket", "StandoffNews", "CaseOpener"];
        const randomSponsor = sponsors[Math.floor(Math.random() * sponsors.length)];
        
        logElem.textContent = `Вы подписались на "${randomSponsor}" и получили +5 Голды!`;
    }

    // Покупка пассивного дохода
    function buyAutoclicker() {
        if (gold >= 50) {
            gold -= 50;
            autoClickers += 1;
            goldElem.textContent = gold;
            logElem.textContent = "Вы наняли Бота! Теперь голда тикает автоматически.";
        } else {
            logElem.textContent = "Не хватает голды для покупки бота!";
        }
    }

    // Пассивный доход каждую секунду
    setInterval(() => {
        if (autoClickers > 0) {
            gold += autoClickers;
            goldElem.textContent = gold;
        }
    }, 1000);
</script>

</body>
  </html>
